<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chessrena</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #111412;
    --surface: #191d1a;
    --surface-raised: #202521;
    --surface-hover: #272d28;
    --border: #343b36;
    --border-soft: #292f2b;
    --text: #e8ece8;
    --muted: #a1aaa3;
    --quiet: #778078;
    --accent: #a8d5b1;
    --accent-ink: #17221a;
    --warning: #e0c27d;
    --danger: #e49a91;
    --board-light: #d8d3c4;
    --board-dark: #63766a;
    --piece-light: #f5f3eb;
    --piece-dark: #1e2621;
    --focus: #bddfc4;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-synthesis: none;
    text-rendering: optimizeLegibility;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-width: 320px; min-height: 100vh; background: var(--bg); color: var(--text); }
  button, input { font: inherit; }
  button { color: inherit; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .app { min-height: 100vh; }
  .topbar { height: 62px; display: flex; align-items: center; padding: 0 32px; border-bottom: 1px solid var(--border-soft); background: #151916; }
  .brand { display: flex; align-items: center; gap: 11px; font-size: 16px; font-weight: 650; letter-spacing: .01em; }
  .brand-mark { width: 25px; height: 25px; border: 1px solid #66796c; display: grid; place-items: center; color: var(--accent); font-family: Georgia, serif; font-size: 17px; line-height: 1; }
  .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: 12px; }
  .dot { width: 7px; height: 7px; background: #8db997; border-radius: 50%; }
  main { width: min(1120px, calc(100% - 64px)); margin: 0 auto; padding: 42px 0 64px; }
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 25px; }
  h1 { margin: 0; font-size: 25px; line-height: 1.25; font-weight: 620; letter-spacing: -.025em; }
  .subhead { margin: 7px 0 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
  .button { min-height: 37px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 13px; border: 1px solid var(--border); border-radius: 5px; background: var(--surface-raised); color: var(--text); font-size: 13px; font-weight: 560; cursor: pointer; transition: background .12s ease, border-color .12s ease; }
  .button:hover:not(:disabled) { background: var(--surface-hover); border-color: #4a554d; }
  .button:disabled { opacity: .43; cursor: not-allowed; }
  .button-primary { color: var(--accent-ink); border-color: var(--accent); background: var(--accent); }
  .button-primary:hover:not(:disabled) { background: #b7dfbf; border-color: #b7dfbf; }
  .button-quiet { background: transparent; border-color: transparent; color: var(--muted); }
  .button-quiet:hover:not(:disabled) { background: var(--surface-hover); color: var(--text); }
  .button-danger { color: var(--danger); }
  .plus { font-size: 19px; font-weight: 400; line-height: 1; margin-top: -2px; }
  .section-label { margin: 0 0 12px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .09em; font-weight: 650; }
  .match-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .match-card { position: relative; display: flex; gap: 17px; align-items: center; min-height: 146px; padding: 16px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface); cursor: pointer; transition: background .12s ease, border-color .12s ease; }
  .match-card:hover { background: #1d221e; border-color: #566159; }
  .match-card:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .match-info { min-width: 0; flex: 1; align-self: stretch; display: flex; flex-direction: column; justify-content: center; padding-right: 26px; }
  .match-title { overflow: hidden; color: var(--text); font-size: 15px; font-weight: 620; text-overflow: ellipsis; white-space: nowrap; }
  .match-names { margin-top: 7px; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .match-meta { display: flex; align-items: center; gap: 8px; margin-top: 13px; color: var(--quiet); font-size: 11px; }
  .status { display: inline-flex; align-items: center; gap: 6px; color: #c5d8c8; }
  .status .dot { width: 6px; height: 6px; background: #9bc5a2; }
  .status.finished { color: var(--muted); }
  .status.finished .dot { background: #818982; }
  .meta-separator { width: 3px; height: 3px; background: #59625b; border-radius: 50%; }
  .menu-wrap { position: absolute; top: 10px; right: 10px; z-index: 3; }
  .menu-trigger { width: 31px; height: 31px; display: grid; place-items: center; border: 1px solid transparent; border-radius: 4px; background: transparent; color: var(--muted); cursor: pointer; font-size: 20px; line-height: 1; }
  .menu-trigger:hover, .menu-trigger[aria-expanded="true"] { border-color: var(--border); background: var(--surface-raised); color: var(--text); }
  .menu { position: absolute; top: 35px; right: 0; width: 145px; padding: 4px; border: 1px solid var(--border); border-radius: 5px; background: #202521; box-shadow: 0 8px 24px #0008; }
  .menu[hidden] { display: none; }
  .menu button { width: 100%; min-height: 33px; padding: 0 9px; text-align: left; border: 0; border-radius: 3px; background: transparent; color: var(--text); font-size: 12px; cursor: pointer; }
  .menu button:hover { background: var(--surface-hover); }
  .menu button.delete { color: var(--danger); }
  .board-thumb { flex: 0 0 106px; width: 106px; aspect-ratio: 1; display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); overflow: hidden; border: 1px solid #586359; border-radius: 2px; }
  .sq { display: grid; place-items: center; line-height: 1; user-select: none; }
  .sq.light { background: var(--board-light); }
  .sq.dark { background: var(--board-dark); }
  .piece { font-family: "Segoe UI Symbol", "DejaVu Sans", serif; font-size: 21px; }
  .piece.white { color: var(--piece-light); text-shadow: 0 1px 1px #202620; }
  .piece.black { color: var(--piece-dark); text-shadow: 0 1px 0 #aeb5a9; }
  .empty-state { padding: 58px 24px; border: 1px dashed var(--border); border-radius: 7px; text-align: center; color: var(--muted); }
  .empty-state strong { display: block; color: var(--text); font-size: 14px; font-weight: 600; }
  .empty-state p { margin: 7px 0 0; font-size: 12px; }
  .back-button { margin: -6px 0 20px -9px; }
  .detail-head { display: flex; align-items: center; gap: 15px; margin-bottom: 22px; }
  .detail-head h1 { font-size: 23px; }
  .detail-title-block { min-width: 0; }
  .detail-status { margin-top: 6px; font-size: 12px; color: var(--muted); }
  .detail-actions { display: flex; gap: 8px; margin-left: auto; }
  .detail-layout { display: grid; grid-template-columns: minmax(340px, 1fr) 330px; gap: 17px; align-items: start; }
  .panel { border: 1px solid var(--border); border-radius: 7px; background: var(--surface); }
  .board-panel { padding: 18px; }
  .board-topline { display: flex; justify-content: space-between; align-items: center; margin-bottom: 13px; color: var(--muted); font-size: 12px; }
  .turn-label { color: var(--text); font-weight: 570; }
  .big-board-wrap { width: min(100%, 590px); margin: 0 auto; padding-left: 20px; padding-bottom: 20px; position: relative; }
  .big-board { width: 100%; aspect-ratio: 1; display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); overflow: hidden; border: 1px solid #677469; }
  .big-board .piece { font-size: clamp(25px, 4.3vw, 51px); }
  .coords-rank { position: absolute; top: 0; bottom: 20px; left: 0; width: 17px; display: grid; grid-template-rows: repeat(8, 1fr); align-items: center; justify-items: center; color: var(--muted); font-size: 10px; }
  .coords-file { position: absolute; left: 20px; right: 0; bottom: 0; height: 16px; display: grid; grid-template-columns: repeat(8, 1fr); justify-items: center; align-items: center; color: var(--muted); font-size: 10px; }
  .side-column { display: grid; gap: 12px; }
  .panel-head { padding: 14px 15px 11px; border-bottom: 1px solid var(--border-soft); font-size: 12px; font-weight: 620; }
  .panel-body { padding: 14px 15px; }
  .agent-row { display: flex; align-items: center; gap: 10px; min-height: 49px; }
  .agent-row + .agent-row { border-top: 1px solid var(--border-soft); }
  .agent-badge { width: 27px; height: 27px; display: grid; place-items: center; border: 1px solid var(--border); border-radius: 4px; color: var(--muted); font-size: 11px; font-weight: 650; }
  .agent-copy { min-width: 0; flex: 1; }
  .agent-name { font-size: 12px; font-weight: 570; }
  .agent-side { margin-top: 3px; color: var(--muted); font-size: 10px; }
  .agent-state { color: var(--muted); font-size: 10px; }
  .copy-button { min-height: 29px; padding: 0 8px; font-size: 11px; }
  .notice { padding: 10px 11px; border: 1px solid #554c37; border-radius: 4px; background: #29261f; color: #d6c9a7; font-size: 11px; line-height: 1.45; }
  .tunnel-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .tunnel-state { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 11px; }
  .tunnel-state .dot { background: #9bc5a2; }
  .tunnel-url { margin-top: 7px; color: var(--quiet); font-size: 10px; overflow-wrap: anywhere; }
  .move-list { display: grid; grid-template-columns: 26px 1fr 1fr; gap: 0 8px; max-height: 138px; overflow: auto; font-size: 11px; }
  .move-list div { padding: 5px 0; border-bottom: 1px solid var(--border-soft); }
  .move-number { color: var(--quiet); }
  .move-name { color: var(--text); }
  .form-panel { max-width: 700px; }
  .form-body { padding: 20px; }
  .field-label { display: block; margin-bottom: 7px; color: var(--muted); font-size: 11px; font-weight: 600; }
  .text-input { width: 100%; min-height: 38px; padding: 0 11px; border: 1px solid var(--border); border-radius: 4px; background: #111512; color: var(--text); font-size: 13px; }
  .form-help { margin: 7px 0 18px; color: var(--quiet); font-size: 11px; }
  .slot { display: flex; align-items: center; gap: 11px; padding: 13px 0; border-top: 1px solid var(--border-soft); }
  .slot-index { width: 25px; height: 25px; display: grid; place-items: center; border: 1px solid var(--border); color: var(--muted); font-size: 11px; }
  .slot-detail { flex: 1; min-width: 0; }
  .slot-title { font-size: 12px; font-weight: 580; }
  .slot-status { margin-top: 3px; color: var(--muted); font-size: 10px; }
  .form-bottom { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 17px; }
  .small-note { max-width: 360px; color: var(--quiet); font-size: 10px; line-height: 1.4; }
  .dialog-backdrop { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 20px; background: #080a08bb; }
  .dialog-backdrop[hidden] { display: none; }
  .dialog { width: min(390px, 100%); padding: 19px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface); box-shadow: 0 18px 56px #0009; }
  .dialog h2 { margin: 0; font-size: 16px; font-weight: 620; }
  .dialog p { margin: 7px 0 16px; color: var(--muted); font-size: 12px; line-height: 1.5; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 17px; }
  .toast { position: fixed; bottom: 22px; left: 50%; z-index: 20; transform: translateX(-50%); padding: 10px 14px; border: 1px solid var(--border); border-radius: 5px; background: #252c27; color: var(--text); font-size: 12px; box-shadow: 0 8px 24px #0006; }
  .toast[hidden] { display: none; }
  @media (max-width: 760px) {
    .topbar { padding: 0 18px; }
    main { width: calc(100% - 36px); padding-top: 29px; }
    .match-grid { grid-template-columns: 1fr; }
    .detail-layout { grid-template-columns: 1fr; }
    .detail-head { flex-wrap: wrap; }
    .detail-actions { margin-left: auto; }
  }
  @media (max-width: 480px) {
    .page-head { align-items: flex-start; flex-direction: column; }
    .detail-actions { width: 100%; margin-left: 0; }
    .detail-actions .button { flex: 1; }
    .match-card { gap: 12px; padding: 12px; }
    .board-thumb { flex-basis: 82px; width: 82px; }
    .piece { font-size: 16px; }
    .big-board-wrap { padding-left: 17px; padding-bottom: 17px; }
    .coords-rank { width: 14px; bottom: 17px; font-size: 9px; }
    .coords-file { left: 17px; font-size: 9px; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true">C</span><span>Chessrena</span></div>
    <div class="topbar-right"><span class="dot" aria-hidden="true"></span><span>Local app</span></div>
  </header>
  <main id="main"></main>
</div>
<div class="dialog-backdrop" id="dialogBackdrop" hidden>
  <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
    <h2 id="dialogTitle"></h2>
    <p id="dialogText"></p>
    <div id="dialogContent"></div>
    <div class="dialog-actions" id="dialogActions"></div>
  </section>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<script>
(() => {
  const startPosition = [
    ['♜','','♝','♛','♚','♝','','♜'],
    ['','♟','♟','♟','','♟','♟','♟'],
    ['♟','','','','','♞','',''],
    ['','','','','♟','','',''],
    ['♗','','','','','','',''],
    ['','','','','','♘','',''],
    ['♙','♙','♙','♙','','♙','♙','♙'],
    ['♖','♘','♗','♕','♔','♗','','♖']
  ];
  const openingPosition = [
    ['♜','','♝','♛','♚','♝','','♜'],
    ['','♟','♟','♟','','♟','♟','♟'],
    ['♟','','','','','♞','',''],
    ['','','','','♟','','',''],
    ['♗','','','','','','',''],
    ['','','','','','♘','',''],
    ['♙','♙','♙','♙','','♙','♙','♙'],
    ['♖','♘','♗','♕','♔','♗','','♖']
  ];
  const matches = [
    { id: 'm1', name: 'Atlas vs Birch', white: 'Atlas', black: 'Birch', status: 'Paused', move: '4... Nf6', position: openingPosition, ready: true, history: [['1', 'e4', 'e5'], ['2', 'Nf3', 'Nc6'], ['3', 'Bb5', 'a6'], ['4', 'Ba4', 'Nf6']] },
    { id: 'm2', name: 'Cedar vs Flint', white: 'Cedar', black: 'Flint', status: 'Finished', move: '1-0', position: startPosition, ready: false, history: [['1', 'd4', 'Nf6'], ['2', 'c4', 'e6'], ['3', 'Nc3', 'Bb4']] }
  ];
  const main = document.getElementById('main');
  const backdrop = document.getElementById('dialogBackdrop');
  let currentId = null;
  let dialogAction = null;
  let toastTimer;

  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function pieceColor(piece) { return '♙♖♘♗♕♔'.includes(piece) ? 'white' : 'black'; }
  function drawBoard(position, className, withCoords) {
    const squares = [];
    position.forEach((row, r) => row.forEach((piece, c) => {
      const color = (r + c) % 2 === 0 ? 'light' : 'dark';
      squares.push(`<div class="sq ${color}">${piece ? `<span class="piece ${pieceColor(piece)}">${piece}</span>` : ''}</div>`);
    }));
    const ranks = withCoords ? `<div class="coords-rank">${[8,7,6,5,4,3,2,1].map(n => `<span>${n}</span>`).join('')}</div><div class="coords-file">${'abcdefgh'.split('').map(f => `<span>${f}</span>`).join('')}</div>` : '';
    return `${withCoords ? '<div class="big-board-wrap">' : ''}<div class="${className}" role="img" aria-label="Chess board position">${squares.join('')}</div>${ranks}${withCoords ? '</div>' : ''}`;
  }
  function byId(id) { return matches.find(m => m.id === id); }
  function showToast(text) {
    const el = document.getElementById('toast'); el.textContent = text; el.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.hidden = true, 2200);
  }
  function renderHome() {
    currentId = null;
    const cards = matches.map(m => `
      <article class="match-card" tabindex="0" role="button" aria-label="Open ${esc(m.name)}" data-open="${esc(m.id)}">
        ${drawBoard(m.position, 'board-thumb', false)}
        <div class="match-info">
          <div class="match-title">${esc(m.name)}</div>
          <div class="match-names">White ${esc(m.white)} <span aria-hidden="true">·</span> Black ${esc(m.black)}</div>
          <div class="match-meta"><span class="status ${m.status === 'Finished' ? 'finished' : ''}"><span class="dot"></span>${esc(m.status)}</span><span class="meta-separator"></span><span>${esc(m.move)}</span></div>
        </div>
        <div class="menu-wrap">
          <button class="menu-trigger" type="button" aria-label="Match options" aria-expanded="false" data-menu="${esc(m.id)}">⋯</button>
          <div class="menu" hidden data-menu-panel="${esc(m.id)}">
            <button type="button" data-rename="${esc(m.id)}">Rename</button>
            <button type="button" class="delete" data-delete="${esc(m.id)}">Delete match</button>
          </div>
        </div>
      </article>`).join('');
    main.innerHTML = `
      <div class="page-head"><div><h1>Matches</h1><p class="subhead">Open a match to view the board and agent status.</p></div><button class="button button-primary" id="newMatch"><span class="plus" aria-hidden="true">+</span>New match</button></div>
      <p class="section-label">Saved matches</p>
      ${matches.length ? `<section class="match-grid" aria-label="Saved matches">${cards}</section>` : `<section class="empty-state"><strong>No matches yet</strong><p>Create a match to get started.</p></section>`}`;
    document.getElementById('newMatch').addEventListener('click', createMatch);
    main.querySelectorAll('[data-open]').forEach(card => {
      card.addEventListener('click', e => { if (e.target.closest('.menu-wrap')) return; openMatch(card.dataset.open); });
      card.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && !e.target.closest('.menu-wrap')) { e.preventDefault(); openMatch(card.dataset.open); } });
    });
    main.querySelectorAll('[data-menu]').forEach(btn => btn.addEventListener('click', e => {
      e.stopPropagation(); const panel = main.querySelector(`[data-menu-panel="${btn.dataset.menu}"]`); const wasOpen = !panel.hidden;
      closeMenus(); panel.hidden = wasOpen; btn.setAttribute('aria-expanded', String(!wasOpen));
    }));
    main.querySelectorAll('[data-rename]').forEach(btn => btn.addEventListener('click', e => { e.stopPropagation(); closeMenus(); renameMatch(btn.dataset.rename); }));
    main.querySelectorAll('[data-delete]').forEach(btn => btn.addEventListener('click', e => { e.stopPropagation(); closeMenus(); deleteMatch(btn.dataset.delete); }));
  }
  function closeMenus() {
    main.querySelectorAll('.menu').forEach(m => m.hidden = true);
    main.querySelectorAll('.menu-trigger').forEach(b => b.setAttribute('aria-expanded', 'false'));
  }
  function openMatch(id) {
    const m = byId(id); if (!m) return; currentId = id;
    const isFinished = m.status === 'Finished';
    const statusText = m.status === 'Paused' ? 'Saved match. Both agents need to reconnect before play can continue.' : isFinished ? 'Match complete.' : 'Both agents are connected.';
    const actionLabel = isFinished ? 'View result' : m.status === 'Paused' ? 'Resume match' : 'Pause match';
    main.innerHTML = `
      <button class="button button-quiet back-button" id="backToMatches">‹&nbsp; Matches</button>
      <div class="detail-head"><div class="detail-title-block"><h1>${esc(m.name)}</h1><div class="detail-status"><span class="status ${isFinished ? 'finished' : ''}"><span class="dot"></span>${esc(m.status)}</span></div></div><div class="detail-actions"><button class="button" id="closeMatch">Close match</button><button class="button ${isFinished ? '' : 'button-primary'}" id="stateAction" ${m.status === 'Paused' && !m.ready ? 'disabled' : ''}>${actionLabel}</button><button class="button button-danger" id="endMatch" ${isFinished ? 'disabled' : ''}>End match</button></div></div>
      <div class="detail-layout">
        <section class="panel board-panel"><div class="board-topline"><span>Move ${m.history.length}</span><span class="turn-label">${isFinished ? 'Game over' : m.status === 'Paused' ? 'Paused' : 'Black to move'}</span></div>${drawBoard(m.position, 'big-board', true)}</section>
        <aside class="side-column">
          ${m.status === 'Paused' ? `<div class="notice">${statusText}</div>` : ''}
          <section class="panel"><div class="panel-head">Agents</div><div class="panel-body">
            <div class="agent-row"><div class="agent-badge">W</div><div class="agent-copy"><div class="agent-name">${esc(m.white)}</div><div class="agent-side">White</div></div><span class="agent-state">${m.status === 'Paused' ? 'Reconnect' : 'Ready'}</span><button class="button copy-button" data-copy="white">Copy prompt</button></div>
            <div class="agent-row"><div class="agent-badge">B</div><div class="agent-copy"><div class="agent-name">${esc(m.black)}</div><div class="agent-side">Black</div></div><span class="agent-state">${m.status === 'Paused' ? 'Reconnect' : 'Ready'}</span><button class="button copy-button" data-copy="black">Copy prompt</button></div>
          </div></section>
          <section class="panel"><div class="panel-head">Tunnel</div><div class="panel-body"><div class="tunnel-row"><span class="tunnel-state"><span class="dot"></span>Online</span><button class="button copy-button" id="copyUrl">Copy address</button></div><div class="tunnel-url">https://chessrena-example.trycloudflare.com</div></div></section>
          <section class="panel"><div class="panel-head">Move history</div><div class="panel-body"><div class="move-list">${m.history.map(row => `<div class="move-number">${esc(row[0])}.</div><div class="move-name">${esc(row[1])}</div><div class="move-name">${esc(row[2])}</div>`).join('')}</div></div></section>
        </aside>
      </div>`;
    document.getElementById('backToMatches').addEventListener('click', closeCurrent);
    document.getElementById('closeMatch').addEventListener('click', closeCurrent);
    document.getElementById('stateAction').addEventListener('click', () => {
      if (m.status === 'Paused') { m.status = 'In progress'; m.ready = true; }
      else if (m.status === 'In progress') { m.status = 'Paused'; m.ready = false; }
      renderHome(); openMatch(id);
    });
    document.getElementById('endMatch').addEventListener('click', () => {
      showDialog('End match', 'End this match now? The saved result will remain in your match list.', null, [
        {label:'Cancel', action: closeDialog},
        {label:'End match', primary:false, danger:true, action: () => { m.status = 'Finished'; closeDialog(); renderHome(); showToast('Match ended'); }}
      ]);
    });
    main.querySelectorAll('[data-copy]').forEach(b => b.addEventListener('click', () => copyText(`Connect to Chessrena at https://chessrena-example.trycloudflare.com. Register for match ${m.name} as ${b.dataset.copy} and fetch the current position.`)));
    document.getElementById('copyUrl').addEventListener('click', () => copyText('https://chessrena-example.trycloudflare.com'));
  }
  function closeCurrent() {
    if (currentId) { const m = byId(currentId); if (m && m.status === 'In progress') { m.status = 'Paused'; m.ready = false; } }
    renderHome();
  }
  function createMatch() {
    let index = matches.length + 1;
    let name = `New match ${index}`;
    while (matches.some(m => norm(m.name) === norm(name))) name = `New match ${++index}`;
    const item = { id: `m${Date.now()}`, name, white: 'Waiting for agent', black: 'Waiting for agent', status: 'Waiting', move: 'Not started', position: startPosition, ready: false, history: [] };
    matches.unshift(item);
    openSetup(item.id);
  }
  function openSetup(id) {
    const m = byId(id); if (!m) return; currentId = id;
    main.innerHTML = `
      <button class="button button-quiet back-button" id="setupBack">‹&nbsp; Matches</button>
      <div class="page-head"><div><h1>New match</h1><p class="subhead">Share one prompt with each agent. The match name must be unique.</p></div></div>
      <section class="panel form-panel"><div class="form-body">
        <label class="field-label" for="matchName">Match name</label><input class="text-input" id="matchName" value="${esc(m.name)}" maxlength="48" autocomplete="off"><p class="form-help">Agent names will appear here after they register.</p>
        <div class="slot"><div class="slot-index">1</div><div class="slot-detail"><div class="slot-title">First agent</div><div class="slot-status">Waiting for registration</div></div><button class="button copy-button" data-setup-copy="1">Copy prompt</button></div>
        <div class="slot"><div class="slot-index">2</div><div class="slot-detail"><div class="slot-title">Second agent</div><div class="slot-status">Waiting for registration</div></div><button class="button copy-button" data-setup-copy="2">Copy prompt</button></div>
        <div class="form-bottom"><span class="small-note">Start becomes available after both agents register and mark ready.</span><button class="button button-primary" disabled>Start match</button></div>
      </div></section>`;
    document.getElementById('setupBack').addEventListener('click', () => { renderHome(); });
    document.getElementById('matchName').addEventListener('change', e => {
      const candidate = e.target.value.trim();
      if (!candidate) { e.target.value = m.name; showToast('Enter a match name'); return; }
      if (matches.some(other => other.id !== m.id && norm(other.name) === norm(candidate))) { e.target.value = m.name; showToast('That match name is already in use'); return; }
      m.name = candidate;
    });
    main.querySelectorAll('[data-setup-copy]').forEach(b => b.addEventListener('click', () => copyText(`Join Chessrena match ${m.name}. Register as agent slot ${b.dataset.setupCopy}, choose a unique name for this match, then mark ready.`)));
  }
  function norm(s) { return String(s).trim().toLocaleLowerCase(); }
  function showDialog(title, text, content, actions) {
    document.getElementById('dialogTitle').textContent = title;
    document.getElementById('dialogText').textContent = text;
    const contentEl = document.getElementById('dialogContent'); contentEl.innerHTML = content || '';
    const actionsEl = document.getElementById('dialogActions'); actionsEl.innerHTML = '';
    actions.forEach(item => { const b = document.createElement('button'); b.className = `button ${item.primary ? 'button-primary' : ''} ${item.danger ? 'button-danger' : ''}`; b.textContent = item.label; b.addEventListener('click', item.action); actionsEl.appendChild(b); });
    backdrop.hidden = false;
  }
  function closeDialog() { backdrop.hidden = true; }
  function renameMatch(id) {
    const m = byId(id); if (!m) return;
    showDialog('Rename match', 'Choose a name that is not already in use.', '<label class="field-label" for="renameInput">Match name</label><input class="text-input" id="renameInput" maxlength="48" autocomplete="off">', [
      {label:'Cancel', action: closeDialog},
      {label:'Save name', primary:true, action: () => {
        const value = document.getElementById('renameInput').value.trim();
        if (!value) { showToast('Enter a match name'); return; }
        if (matches.some(other => other.id !== id && norm(other.name) === norm(value))) { showToast('That match name is already in use'); return; }
        m.name = value; closeDialog(); renderHome();
      }}
    ]);
    document.getElementById('renameInput').value = m.name;
    document.getElementById('renameInput').focus();
  }
  function deleteMatch(id) {
    const m = byId(id); if (!m) return;
    showDialog('Delete match', `Delete “${m.name}” and its saved game data? This cannot be undone.`, null, [
      {label:'Cancel', action: closeDialog},
      {label:'Delete match', danger:true, action: () => { matches.splice(matches.findIndex(x => x.id === id), 1); closeDialog(); renderHome(); showToast('Match deleted'); }}
    ]);
  }
  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); showToast('Copied'); }
    catch { showToast('Clipboard access is unavailable in this preview'); }
  }
  backdrop.addEventListener('click', e => { if (e.target === backdrop) closeDialog(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeDialog(); closeMenus(); } });
  renderHome();
})();
</script>
</body>
</html>
