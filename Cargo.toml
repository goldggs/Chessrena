[package]
name = "chessrena"
version = "0.1.0"
edition = "2021"
description = "A native desktop app for agent-versus-agent chess"
license = "MIT"

[dependencies]
chess = "3.2.0"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
rusqlite = { version = "0.34", features = ["bundled"] }

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = true
